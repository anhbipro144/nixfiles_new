include themes/Kanagawa_dragon.conf
font_family      FiraCode Nerd Font

background_opacity 0.6
confirm_os_window_close -1
allow_remote_control yes
listen_on unix:@mykitty
shell_integration enabled
font_size 16.0

# Native cursor movement trail; replaces smear-cursor.nvim.
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 1

# kitty-scrollback.nvim Kitten alias
# action_alias kitty_scrollback_nvim kitten /home/neo/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args --clean --noplugin -n

action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args -u ~/.config/ksb-nvim/init.lua -n

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim

# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Codex CLI uses Ctrl+V to attach an image from the clipboard. On macOS the
# Globe is mapped to Command, so translate Command shortcuts to terminal
# Control shortcuts inside Kitty.
map super+v send_key ctrl+v
# Keep ordinary clipboard text paste on Command+Shift+V inside Kitty.
map super+shift+v paste_from_clipboard
# Delete the previous word in shells and Codex prompts.
map super+backspace send_key ctrl+w
# Copy a Kitty selection; with no selection, send Ctrl+C to the foreground app.
map super+c copy_or_interrupt

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
